name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev ccache libncurses5 libstdc++6 autoconf libtool pkg-config

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer virtualenv cython

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: "1"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dlnacast-apk
        path: bin/*.apk
