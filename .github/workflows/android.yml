name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # Shifting to modern ecosystem tags to resolve the Node structure block
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    - name: Set up Python Runtime
      uses: actions/setup-python@v5.3.0
      with:
        python-version: '3.11'

    - name: Install Compilers and Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev ccache libncurses5 libstdc++6 autoconf libtool pkg-config

    - name: Pre-install Build Engines
      run: |
        pip install --upgrade pip
        pip install buildozer virtualenv cython

    - name: Run Buildozer Engine
      run: |
        yes | buildozer -v android debug
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: "1"

    - name: Export Compiled APK
      uses: actions/upload-artifact@v4.4.3
      with:
        name: dlnacast-apk
        path: bin/*.apk
